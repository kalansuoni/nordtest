{% load django_bootstrap5 %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    {% bootstrap_css %}
    {% bootstrap_javascript %}
</head>

<body>

<nav class="navbar navbar-expand-md navbar-light bg-light mb-4">

    <div class="container-fluid">

        <a class="navbar-brand"
           href="{% url 'blogs:index' %}">
            Blog
        </a>

        <div class="navbar-nav me-auto">

            <a class="nav-link"
               href="{% url 'blogs:blogs' %}">
                Blogs
            </a>

            {% if user.is_authenticated %}

                <a class="nav-link"
                   href="{% url 'blogs:new_blog' %}">
                    New Blog
                </a>

            {% endif %}

        </div>

        <div class="navbar-nav ms-auto">

            {% if user.is_authenticated %}

                <span class="navbar-text me-3">
                    Hello, {{ user.username }}
                </span>

                <a class="nav-link"
                   href="{% url 'logout' %}">
                    Log out
                </a>

            {% else %}

                <a class="nav-link"
                   href="{% url 'accounts:register' %}">
                    Register
                </a>

                <a class="nav-link"
                   href="{% url 'login' %}">
                    Log in
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<main class="container">

    {% block content %}
    {% endblock content %}

</main>

</body>

</html>
