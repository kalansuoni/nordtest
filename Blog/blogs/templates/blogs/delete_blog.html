{% extends "blogs/base.html" %}

{% block content %}

<h2>Delete Blog</h2>

<p>
    Are you sure you want to delete
    <strong>{{ blog }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button class="btn btn-danger" type="submit">
        Delete Blog
    </button>

    <a class="btn btn-secondary"
       href="{% url 'blogs:blogs' %}">
        Cancel
    </a>
</form>

{% endblock content %}
