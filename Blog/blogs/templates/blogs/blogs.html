{% extends "blogs/base.html" %}

{% block content %}

<h2>Blogs</h2>

<div class="list-group">

{% for blog in blogs %}

    <div class="list-group-item">

        <h5>

            <a href="{% url 'blogs:blog' blog.id %}">
                {{ blog }}
            </a>

        </h5>

        {% if user == blog.owner %}

            <a class="btn btn-primary btn-sm"
               href="{% url 'blogs:new_post' blog.id %}">
                Add Post
            </a>

            <a class="btn btn-danger btn-sm"
               href="{% url 'blogs:delete_blog' blog.id %}">
                Delete
            </a>

        {% endif %}

    </div>

{% empty %}

    <div class="list-group-item">
        No blogs yet.
    </div>

{% endfor %}

</div>

<br>

<a class="btn btn-success"
   href="{% url 'blogs:new_blog' %}">
    Add Blog
</a>

{% endblock content %}
