{% extends "blogs/base.html" %}

{% block content %}

<h2>Log In</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button name="submit">
        Log In
    </button>

    <input
        type="hidden"
        name="next"
        value="{% url 'blogs:index' %}"
    >

</form>

{% endblock content %}
