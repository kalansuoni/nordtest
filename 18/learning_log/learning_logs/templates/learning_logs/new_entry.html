{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<h2>{{ topic }}</h2>

<form action="{% url 'learning_logs:new_entry' topic.id %}" method="post">
    {% csrf_token %}

    {% bootstrap_form form %}

    <button class="btn btn-primary" type="submit">
        Add Entry
    </button>
</form>

{% endblock content %}
