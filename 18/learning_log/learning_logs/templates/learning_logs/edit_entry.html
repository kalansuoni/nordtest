{% extends "learning_logs/base.html" %}
{% load django_bootstrap5 %}

{% block content %}

<h2>Edit Entry</h2>

<form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post">
    {% csrf_token %}

    {% bootstrap_form form %}

    <button class="btn btn-primary" type="submit">
        Save Changes
    </button>
</form>

{% endblock content %}
