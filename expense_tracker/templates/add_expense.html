<!DOCTYPE html>
<html>
<head>
    <title>Add Expense</title>
</head>

<body>

<h1>Add Expense</h1>

<form method="POST">

    <label>Category:</label>
    <input type="text"
           name="category"
           required>

    <br><br>

    <label>Amount:</label>
    <input type="number"
           step="0.01"
           name="amount"
           required>

    <br><br>

    <button type="submit">
        Add Expense
    </button>

</form>

<br>

<a href="/">
    Back to Dashboard
</a>

</body>
</html>
